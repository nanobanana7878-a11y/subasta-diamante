<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Penny Auction</title>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg,#fce4f5,#ede4ff 50%,#e0f2ff); color: #2d2d3a; min-height: 100vh; }
  #root { max-width: 520px; margin: 0 auto; min-height: 100vh; background: linear-gradient(160deg,#fce4f5,#ede4ff 50%,#e0f2ff); padding-bottom: 84px; }
  button { font-family: inherit; cursor: pointer; border: none; font-weight: 700; }
  input { font-family: inherit; }

  .appbar { background: linear-gradient(135deg,#ff5fa2,#a855f7 55%,#5eb8f0); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 20; border-bottom: 3px solid #2a2140; }
  .logo { font-size: 20px; font-weight: 800; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.15); }
  .logo .b { color: #fff2b8; }
  .logo .o { color: #ffe14d; }

  /* Hero */
  .hero { position: relative; margin: 0; overflow: hidden; border-bottom: 3px solid #2a2140; }
  .hero img { width: 100%; display: block; }
  .hero-glow { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.25), transparent 60%); animation: heroPulse 3s ease-in-out infinite; pointer-events: none; }
  @keyframes heroPulse { 0%,100% { opacity: 0.4; } 50% { opacity: 0.9; } }
  .hero-cta { display: flex; gap: 10px; padding: 12px 14px; background: linear-gradient(135deg,#ff5fa2,#a855f7); }
  .hero-cta button { flex: 1; padding: 12px 8px; border-radius: 12px; font-size: 13px; font-weight: 800; border: 2px solid #2a2140; box-shadow: 0 3px 0 #2a2140; line-height: 1.2; white-space: nowrap; }
  .hero-cta button:active { transform: translateY(2px); box-shadow: 0 1px 0 #2a2140; }
  .hero-cta .play { background: linear-gradient(180deg,#ffe14d,#ffc107); color: #6a2fb5; }
  .hero-cta .buy { background: #fff; color: #d6337f; }
  .sparkle { position: absolute; font-size: 18px; animation: floatUp 2.4s ease-in-out infinite; pointer-events: none; }
  @keyframes floatUp { 0%,100% { transform: translateY(0) rotate(0); opacity: 0.7; } 50% { transform: translateY(-8px) rotate(15deg); opacity: 1; } }
  .bidspill { background: rgba(255,255,255,0.22); border: 2px solid #2a2140; color: #fff; border-radius: 999px; padding: 8px 16px; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; text-shadow: 0 1px 0 rgba(0,0,0,0.15); }
  .bidspill .plus { width: 22px; height: 22px; border-radius: 50%; background: #ffe14d; color: #d6337f; display: flex; align-items: center; justify-content: center; font-size: 16px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px; align-items: stretch; }
  .card { background: #fff; border: 2px solid #2a2140; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 0 #2a2140; display: flex; flex-direction: column; cursor: pointer; transition: transform .15s, box-shadow .15s; height: 100%; }
  .card:active { transform: translateY(2px); box-shadow: 0 2px 0 #2a2140; }
  .card.live { border-color: #ff5fa2; box-shadow: 0 4px 0 #d6337f; animation: livePulse 1.6s ease-in-out infinite; }
  @keyframes livePulse { 0%,100% { box-shadow: 0 4px 0 #d6337f; } 50% { box-shadow: 0 4px 0 #d6337f, 0 0 16px rgba(255,95,162,0.5); } }
  .cname { font-size: 13.5px; font-weight: 600; text-align: center; padding: 10px 8px 6px; color: #3a3a4a; min-height: 42px; display: flex; align-items: center; justify-content: center; line-height: 1.2; }
  .cimg { height: 110px; display: flex; align-items: center; justify-content: center; padding: 6px; }
  .cimg img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .cimg .emoji { font-size: 56px; }
  .cprice-box { background: linear-gradient(180deg,#fff5fb,#fbe8f5); padding: 10px 8px; text-align: center; border-top: 2px solid #2a2140; margin-top: auto; }
  .cprice { font-size: 19px; font-weight: 800; color: #16a34a; }
  .cleader { font-size: 11.5px; color: #7a7a8a; margin-top: 2px; min-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctimer { background: linear-gradient(180deg,#ffe14d,#ffc93c); color: #a9570a; font-weight: 800; text-align: center; padding: 7px; margin: 8px 8px 0; border-radius: 6px; font-size: 15px; font-variant-numeric: tabular-nums; letter-spacing: 1px; border: 1.5px solid #2a2140; }
  .cbid { background: linear-gradient(180deg,#ff8fc4,#ff5fa2); color: #fff; font-weight: 800; text-align: center; padding: 11px; font-size: 13.5px; letter-spacing: 0.5px; border-top: 2px solid #2a2140; text-shadow: 0 1px 0 rgba(0,0,0,0.15); margin-top: 8px; }
  .card.live .cbid { animation: bidGlow 1.2s ease-in-out infinite; }
  @keyframes bidGlow { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.15); } }
  .cbuy { display: flex; justify-content: space-between; padding: 9px 12px; font-size: 12px; color: #555; background: #fff; }
  .cbuy b { color: #2d2d3a; }
  .status-badge { font-size: 9px; font-weight: 800; letter-spacing: 0.5px; padding: 2px 7px; border-radius: 999px; display: inline-block; margin: 6px auto 0; border: 1px solid #2a2140; }

  .bottomnav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; background: #fff; border-top: 2px solid #2a2140; display: flex; justify-content: space-around; padding: 8px 0 10px; z-index: 20; }
  .navitem { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: #8a8a98; font-weight: 600; background: none; }
  .navitem.on { color: #d6337f; }
  .navitem .ic { font-size: 20px; }

  .modal-bg { position: fixed; inset: 0; background: rgba(30,20,50,0.55); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .sheet { background: #fff; width: 100%; max-width: 520px; border: 2px solid #2a2140; border-bottom: none; border-radius: 20px 20px 0 0; max-height: 92vh; overflow-y: auto; animation: slideUp .25s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-handle { width: 40px; height: 4px; background: #d0d0da; border-radius: 999px; margin: 10px auto 4px; }

  .det-img { height: 200px; display: flex; align-items: center; justify-content: center; padding: 16px; background: #f7f7fb; }
  .det-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .det-img .emoji { font-size: 100px; }
  .det-body { padding: 16px 16px 28px; }
  .det-name { font-size: 22px; font-weight: 800; text-align: center; }
  .det-price { font-size: 40px; font-weight: 900; color: #16a34a; text-align: center; margin: 6px 0 2px; }
  .det-meta { text-align: center; color: #888; font-size: 13px; }
  .det-timer { background: linear-gradient(180deg,#ffe14d,#ffc93c); color: #a9570a; font-weight: 800; text-align: center; padding: 14px; border-radius: 10px; font-size: 30px; margin: 14px 0; font-variant-numeric: tabular-nums; letter-spacing: 2px; border: 2px solid #2a2140; animation: timerBeat 1s ease-in-out infinite; }
  @keyframes timerBeat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  .det-bid { width: 100%; background: linear-gradient(180deg,#ff8fc4,#ff5fa2); color: #fff; font-weight: 800; padding: 16px; border-radius: 12px; font-size: 17px; border: 2px solid #2a2140; box-shadow: 0 4px 0 #2a2140; text-shadow: 0 1px 0 rgba(0,0,0,0.15); }
  .det-bid:active { transform: translateY(2px); box-shadow: 0 2px 0 #2a2140; }
  .det-win { width: 100%; background: linear-gradient(135deg,#22c55e,#4ade80); color: #fff; font-weight: 800; padding: 16px; border-radius: 12px; font-size: 17px; text-align: center; border: 2px solid #2a2140; }
  .feed-title { font-size: 14px; font-weight: 700; color: #555; margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; }
  .feed-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 10px; margin-bottom: 6px; background: #f5f5fa; border: 1.5px solid #2a2140; font-size: 14px; }
  .feed-row.me { background: #ede9fe; }
  .feed-av { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 13px; margin-right: 10px; border: 1.5px solid #2a2140; }
  .feed-name { font-weight: 600; }
  .feed-time { color: #999; font-size: 12px; }

  .pad { padding: 20px; }
  .h2 { font-size: 19px; font-weight: 800; margin-bottom: 16px; color: #2d2d3a; }
  .field { width: 100%; padding: 13px; border-radius: 10px; border: 1.5px solid #dcdce6; background: #fafafc; color: #2d2d3a; font-size: 15px; margin-bottom: 11px; }
  .primary { width: 100%; padding: 14px; background: linear-gradient(135deg,#ff5fa2,#a855f7); color: #fff; font-size: 15px; border-radius: 10px; }
  .tab { flex: 1; padding: 11px; border-radius: 10px; background: #f3eafd; color: #888; font-size: 14px; }
  .tab.on { background: linear-gradient(135deg,#ff5fa2,#a855f7); color: #fff; }
  .close-x { background: none; font-size: 26px; color: #aaa; line-height: 1; }
  .err { color: #e11d48; font-size: 13px; margin-bottom: 10px; }
  .sect { background: #f7f7fb; border: 1px solid #eaeaf2; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: #ede9fe; color: #6d28d9; padding: 5px 10px; border-radius: 999px; font-size: 13px; }
  .chip button { background: none; color: #e11d48; font-size: 15px; }
  .mini { padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .coinpack { display: flex; justify-content: space-between; align-items: center; padding: 14px; border-radius: 12px; background: #f7f7fb; border: 1.5px solid #eaeaf2; margin-bottom: 10px; }
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); padding: 13px 20px; border-radius: 12px; font-weight: 700; text-align: center; max-width: 88%; z-index: 60; box-shadow: 0 6px 20px rgba(0,0,0,0.2); font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { padding: 8px 6px; border-bottom: 1px solid #eee; text-align: left; }

  /* Ajustes para pantallas estrechas */
  @media (max-width: 360px) {
    .logo { font-size: 17px; }
    .bidspill { padding: 7px 12px; font-size: 13px; }
    .grid { gap: 10px; padding: 10px; }
    .cname { font-size: 12.5px; min-height: 38px; }
    .cprice { font-size: 17px; }
    .hero-cta button { font-size: 12px; padding: 11px 4px; }
  }
  .bottomnav { padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
</style>
</head>

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let REFRESH = async () => {};
async function fetchAll(){
  const {data:{user}} = await sb.auth.getUser(); if(!user) return null;
  const [pr,pz,pu] = await Promise.all([
    sb.from("profiles").select("*"),
    sb.from("prizes").select("*").order("created_at"),
    sb.from("purchases").select("*").order("created_at")]);
  const profs = pr.data||[]; const byId = {}; const users = {};
  profs.forEach(p=>{ byId[p.id]=p.username; users[p.username]={id:p.id,coins:p.coins,role:p.role,prizes:[]}; });
  (pz.data||[]).forEach(z=>{ const n=byId[z.user_id]; if(n) users[n].prizes.push({item:z.item,price:Number(z.price),at:new Date(z.created_at).getTime()}); });
  const purchases = (pu.data||[]).map(p=>({id:p.id,user:byId[p.user_id],coins:p.coins,price:Number(p.price),status:p.status}));
  const mine = profs.find(p=>p.id===user.id);
  return {users,purchases,username:mine?.username};
}

const PACKS = [ {coins:50,price:5},{coins:120,price:10},{coins:300,price:20},{coins:700,price:40} ];

const LIVE_AT = 10, RESET_TO = 10, NEXT_START = 600;
const color = (n)=>{ let h=0; for(const c of n) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 60% 55%)`; };
function fmt(s){ s=Math.max(0,Math.ceil(s)); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  if(h>0) return `${h}h ${String(m).padStart(2,"0")}m`; if(m>0) return `${m}:${String(ss).padStart(2,"0")}`; return `00 : ${String(ss).padStart(2,"0")}`; }
function clock(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0"); }

let AID = 0;
function makeAuction(startsIn){
  const it = ITEMS[AID % ITEMS.length];
  const startPrice = [400,700,600,300,250,200][AID % 6];
  AID++;
  return { id: AID, item: it, remaining: startsIn, startPrice, price: startPrice,
    floorPct: 0.5, floor: Math.round(startPrice*0.5), step: 5,
    leader: null, ended: false, disabled: false, nextBotAt: 5+Math.random()*4, feed: [] };
}

function App(){
  const [db, setDb] = useState(loadDB);
  const [session, setSession] = useState(null);
  const [auctions, setAuctions] = useState(()=>[25,40,60,86400,86400,86400].map(makeAuction));
  const [toast, setToast] = useState(null);
  const [modal, setModal] = useState(null);
  const [detailId, setDetailId] = useState(null);
  const [tab, setTab] = useState("home");

  useEffect(()=>saveDB(db),[db]);
  const refresh=async()=>{ const r=await fetchAll(); if(!r) return null; setDb(prev=>({...prev,users:r.users,purchases:r.purchases})); return r.username; };
  REFRESH=refresh;
  useEffect(()=>{ refresh().then(u=>{ if(u) setSession(u); }); },[]);
  useEffect(()=>{ if(!session) return; const t=setInterval(refresh,20000); return ()=>clearInterval(t); },[session]);
  const cfgRef=useRef(db.config); cfgRef.current=db.config;
  const sessRef=useRef(session); sessRef.current=session;
  const dbRef=useRef(db); dbRef.current=db;

  const me = session ? db.users[session] : null;
  const isAdmin = me?.role==="admin";
  const coins = me?.coins ?? 0;

  const spendCoin=()=>setDb(prev=>{ const u=prev.users[sessRef.current]; if(!u||u.coins<1) return prev;
    return {...prev, users:{...prev.users,[sessRef.current]:{...u,coins:u.coins-1}}}; });
  const awardPrize=(item,price)=>setDb(prev=>{ const u=prev.users[sessRef.current]; if(!u) return prev;
    return {...prev, users:{...prev.users,[sessRef.current]:{...u,prizes:[...u.prizes,{item:item.name,price,at:Date.now()}]}}}; });

  const bid=(id)=>{
    if(!session){ setModal("auth"); return; }
    if(isAdmin){ setToast({t:"El admin no juega, usa una cuenta de usuario",win:false}); return; }
    if((dbRef.current.users[session]?.coins??0)<1){ setModal("shop"); return; }
    let did=false;
    setAuctions(prev=>prev.map(a=>{
      if(a.id!==id||a.ended||a.disabled||a.remaining>LIVE_AT) return a;
      const atFloor=a.price<=a.floor; did=true;
      return {...a, price:atFloor?a.floor:a.price-a.step, leader:{name:session,isMe:true},
        remaining:RESET_TO, nextBotAt:3+Math.random()*4,
        feed:[{name:session,isMe:true,time:clock()},...a.feed].slice(0,25)};
    }));
    if(did){ spendCoin(); sb.rpc("spend_coin").then(()=>refresh()); }
  };

  useEffect(()=>{
    const iv=setInterval(()=>{
      setAuctions(prev=>prev.map(a=>{
        if(a.ended||a.disabled) return a;
        let rem=+(a.remaining-0.2).toFixed(2);
        let {leader,price,nextBotAt,feed}=a;
        const cfg=cfgRef.current;
        if(cfg.botsOn && rem<=LIVE_AT && rem>0.3 && rem<=nextBotAt && price-a.step>=a.floor){
          if(Math.random()<cfg.activity){
            const list=cfg.names.length?cfg.names:["Anónimo"];
            const nm=list[Math.floor(Math.random()*list.length)];
            leader={name:nm,isMe:false}; price-=a.step; rem=RESET_TO; nextBotAt=2+Math.random()*3;
            feed=[{name:nm,isMe:false,time:clock()},...feed].slice(0,25);
          } else nextBotAt=Math.max(0.5,rem-0.6);
        }
        if(rem<=0){
          if(leader?.isMe && sessRef.current){ awardPrize(a.item,price); sb.rpc("award_prize",{p_item:a.item.name,p_price:price}).then(()=>REFRESH()); setToast({t:`¡Ganaste el ${a.item.name} por ${price} $! 🎉`,win:true}); }
          return {...a, remaining:0, ended:true, leader, price, feed};
        }
        return {...a, remaining:rem, leader, price, nextBotAt, feed};
      }));
    },200);
    return ()=>clearInterval(iv);
  },[]);

  useEffect(()=>{
    if(!auctions.some(a=>a.ended)) return;
    const t=setTimeout(()=>setAuctions(prev=>prev.map(a=>{
      if(!a.ended) return a; const na=makeAuction(NEXT_START);
      na.item=a.item; na.startPrice=a.startPrice; na.price=a.startPrice; na.floor=a.floor; na.floorPct=a.floorPct; na.step=a.step; return na;
    })),3500);
    return ()=>clearTimeout(t);
  },[auctions]);

  useEffect(()=>{ if(!toast) return; const t=setTimeout(()=>setToast(null),3500); return ()=>clearTimeout(t); },[toast]);

  const jumpToLive=(id)=>setAuctions(prev=>prev.map(a=>a.id===id&&!a.ended&&!a.disabled&&a.remaining>LIVE_AT?{...a,remaining:15}:a));

  const openCard=(a)=>{
    if(a.disabled||a.ended) return;
    if(a.remaining>LIVE_AT) jumpToLive(a.id);
    setDetailId(a.id);
  };

  const detail = auctions.find(a=>a.id===detailId);
  const sorted=[...auctions].sort((a,b)=>{
    if(a.disabled!==b.disabled) return a.disabled?1:-1;
    if(a.ended!==b.ended) return a.ended?1:-1;
    return a.remaining-b.remaining;
  });

  return (
    <div>
      <div className="appbar">
        <div className="logo">Penny <span className="b">Aucti<span className="o">o</span>n</span></div>
        {session ? (
          isAdmin
            ? <button className="bidspill" onClick={()=>setModal("admin")}><span className="plus">⚙</span> Admin</button>
            : <button className="bidspill" onClick={()=>setModal("shop")}><span className="plus">+</span> Bids <b style={{marginLeft:4}}>{coins}</b></button>
        ) : (
          <button className="bidspill" onClick={()=>setModal("auth")}><span className="plus">+</span> Entrar</button>
        )}

        <button className="buy" onClick={()=>{ session?(isAdmin?setToast({t:"Entra como usuario para comprar",win:false}):setModal("shop")):setModal("auth"); }}>🪙 COMPRAR MONEDAS</button>
      </div>

      <div className="grid">
        {sorted.map(a=>{
          const live=a.remaining<=LIVE_AT && !a.ended && !a.disabled;
          const badge = a.disabled?{t:"PAUSADA",bg:"#e5e5ec",c:"#999"}
            : a.ended?{t:"CERRADA",bg:"#e5e5ec",c:"#999"}
            : live?(a.price<=a.floor?{t:"🏁 REMATE",bg:"#ffe08a",c:"#a9750a"}:{t:"● EN VIVO",bg:"#fecdd3",c:"#e11d48"})
            : {t:"PROGRAMADA",bg:"#ede9fe",c:"#7c3aed"};
          return (
            <div key={a.id} className={"card"+(live?" live":"")} onClick={()=>openCard(a)}>
              <div className="cname">{a.item.name}</div>
              <div className="cimg">{a.item.img?<img src={a.item.img} alt=""/>:<span className="emoji">{a.item.emoji}</span>}</div>
              <div style={{textAlign:"center"}}><span className="status-badge" style={{background:badge.bg,color:badge.c}}>{badge.t}</span></div>
              <div className="cprice-box">
                <div className="cprice">{a.price.toFixed(2)} USD</div>
                <div className="cleader">{a.leader?(a.leader.isMe?"TÚ":a.leader.name):"—"}</div>
              </div>
              <div className="ctimer">{a.disabled||a.ended?"—":live?"00 : "+String(Math.ceil(a.remaining)).padStart(2,"0"):fmt(a.remaining)}</div>
              <div className="cbid">{live?"BID NOW":a.ended?"CERRADA":a.disabled?"PAUSADA":"VER"}</div>
              <div className="cbuy"><span>Buy it</span><b>{a.item.buy} USD</b></div>
            </div>
          );
        })}
      </div>

      <div className="bottomnav">
        {[["home","🏠","Home"],["bids","⚡","Bids"],["exchange","🔄","Exchange"],["account","👤","Account"]].map(([k,ic,lb])=>(
          <button key={k} className={"navitem"+(tab===k?" on":"")} onClick={()=>{
            setTab(k);
            if(k==="account"){ session?(isAdmin?setModal("admin"):setModal("prizes")):setModal("auth"); }
            if(k==="bids" && session && !isAdmin) setModal("shop");
          }}>
            <span className="ic">{ic}</span>{lb}
          </button>
        ))}
      </div>

      {toast && <div className="toast" style={{background:toast.win?"#dcfce7":"#ffe4e6",color:toast.win?"#15803d":"#be123c"}}>{toast.t}</div>}

      {detail && <DetailSheet a={detail} onBid={()=>bid(detail.id)} onClose={()=>setDetailId(null)} />}
      {modal==="auth" && <AuthModal db={db} setDb={setDb} onClose={()=>setModal(null)} onLogin={(u)=>{setSession(u);setModal(null);}} />}
      {modal==="shop" && me && <ShopModal db={db} setDb={setDb} user={session} onClose={()=>setModal(null)} setToast={setToast} />}
      {modal==="prizes" && me && <PrizesModal me={me} user={session} coins={coins} onClose={()=>setModal(null)} onLogout={()=>{sb.auth.signOut();setSession(null);setModal(null);setDb(d=>({...d,users:{},purchases:[]}));}} />}
      {modal==="admin" && isAdmin && <AdminModal db={db} setDb={setDb} auctions={auctions} setAuctions={setAuctions} onClose={()=>setModal(null)} onLogout={()=>{sb.auth.signOut();setSession(null);setModal(null);setDb(d=>({...d,users:{},purchases:[]}));}} />}
    </div>
  );
}

function DetailSheet({ a, onBid, onClose }){
  const live=a.remaining<=LIVE_AT && !a.ended && !a.disabled;
  const atFloor=live && a.price<=a.floor;
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sheet-handle"></div>
        <div className="det-img">{a.item.img?<img src={a.item.img} alt=""/>:<span className="emoji">{a.item.emoji}</span>}</div>
        <div className="det-body">
          <div className="det-name">{a.item.name}</div>
          <div className="det-price">{a.price.toFixed(2)} USD</div>
          <div className="det-meta">
            {a.leader?<>Va ganando <b style={{color:a.leader.isMe?"#16a34a":color(a.leader.name)}}>{a.leader.isMe?"TÚ":a.leader.name}</b></>:"Sin pujas aún"}
            {" · Buy it "}{a.item.buy} USD
          </div>
          <div className="det-timer">{live?"00 : "+String(Math.ceil(a.remaining)).padStart(2,"0"):fmt(a.remaining)}</div>

          {live ? (
            a.leader?.isMe
              ? <div className="det-win">Vas ganando ✓ · cierra en {Math.ceil(a.remaining)}s</div>
              : <button className="det-bid" onClick={onBid}>{atFloor?`🏆 ¡GANAR A ${a.floor} $! (−1 🎟️)`:`BID NOW · bajar a ${a.price-a.step} $ (−1 🎟️)`}</button>
          ) : (
            <div className="det-win" style={{background:"#e5e5ec",color:"#888"}}>
              {a.ended?(a.leader?(a.leader.isMe?`¡La ganaste por ${a.price} $!`:`Ganó ${a.leader.name}`):"Sin pujas"):"Aún no ha empezado"}
            </div>
          )}

          <div className="feed-title">⚡ Pujas en vivo ({a.feed.length})</div>
          {a.feed.length===0 && <div style={{fontSize:13,color:"#aaa",padding:"8px 0"}}>Todavía nadie ha pujado.</div>}
          {a.feed.map((f,i)=>(
            <div key={i} className={"feed-row"+(f.isMe?" me":"")}>
              <div style={{display:"flex",alignItems:"center"}}>
                <div className="feed-av" style={{background:f.isMe?"#16a34a":color(f.name)}}>{(f.isMe?"T":f.name).charAt(0).toUpperCase()}</div>
                <span className="feed-name">{f.isMe?"Tú":f.name}</span>
              </div>
              <span className="feed-time">{f.time}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function AuthModal({ db, setDb, onClose, onLogin }){
  const [tab,setTab]=useState("login");
  const [u,setU]=useState(""); const [p,setP]=useState(""); const [err,setErr]=useState("");
  const submit=async()=>{
    const user=u.trim().toLowerCase();
    if(!user||!p){ setErr("Rellena usuario y contraseña."); return; }
    if(!/^[a-z0-9_]{3,20}$/.test(user)){ setErr("Usuario: 3-20 letras, números o _ (sin espacios)."); return; }
    if(p.length<6){ setErr("La contraseña necesita al menos 6 caracteres."); return; }
    setErr("");
    const email=user+"@subastadiamante.app";
    const res = tab==="register"
      ? await sb.auth.signUp({email,password:p,options:{data:{username:user}}})
      : await sb.auth.signInWithPassword({email,password:p});
    if(res.error){ setErr(tab==="register"?(/registered/i.test(res.error.message)?"Ese usuario ya existe.":res.error.message):"Usuario o contraseña incorrectos."); return; }
    if(!res.data.session){ setErr("Falta desactivar 'Confirm email' en Supabase (Authentication > Providers > Email)."); return; }
    await REFRESH(); onLogin(user);
  };
  return (
    <div className="modal-bg" onClick={onClose}><div className="sheet" onClick={e=>e.stopPropagation()}>
      <div className="sheet-handle"></div>
      <div className="pad">
        <div className="row" style={{marginBottom:16}}><div className="h2" style={{margin:0}}>👤 Acceso</div><button className="close-x" onClick={onClose}>×</button></div>
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          <button className={"tab"+(tab==="login"?" on":"")} onClick={()=>{setTab("login");setErr("");}}>Entrar</button>
          <button className={"tab"+(tab==="register"?" on":"")} onClick={()=>{setTab("register");setErr("");}}>Registrarse</button>
        </div>
        {err && <div className="err">{err}</div>}
        <input className="field" placeholder="Usuario" value={u} onChange={e=>setU(e.target.value)} />
        <input className="field" type="password" placeholder="Contraseña" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} />
        <button className="primary" onClick={submit}>{tab==="login"?"Entrar":"Crear cuenta"}</button>
      </div>
    </div></div>
  );
}

function ShopModal({ db, setDb, user, onClose, setToast }){
  const myPending=db.purchases.filter(p=>p.user===user&&p.status==="pending");
  const buy=async(pk)=>{ const {error}=await sb.rpc("request_purchase",{p_coins:pk.coins,p_price:pk.price});
    if(error){ setToast({t:"No se pudo enviar la solicitud",win:false}); return; }
    await REFRESH(); setToast({t:`Solicitud de ${pk.coins} monedas enviada. El admin la aprobará.`,win:true}); };
  return (
    <div className="modal-bg" onClick={onClose}><div className="sheet" onClick={e=>e.stopPropagation()}>
      <div className="sheet-handle"></div>
      <div className="pad">
        <div className="row" style={{marginBottom:14}}><div className="h2" style={{margin:0}}>🛒 Comprar monedas</div><button className="close-x" onClick={onClose}>×</button></div>
        <div style={{fontSize:13,color:"#888",marginBottom:14}}>Tu compra queda <b>pendiente</b> hasta que el admin la apruebe; entonces las monedas se activan.</div>
        {PACKS.map((pk,i)=>(
          <div className="coinpack" key={i}>
            <div><b style={{fontSize:18}}>🎟️ {pk.coins}</b> monedas</div>
            <button className="mini" style={{background:"linear-gradient(135deg,#7c3aed,#a855f7)",color:"#fff"}} onClick={()=>buy(pk)}>Comprar · {pk.price} €</button>
          </div>
        ))}
        {myPending.length>0 && <div className="sect" style={{marginTop:14,marginBottom:0}}>
          <b style={{fontSize:13}}>Solicitudes pendientes</b>
          {myPending.map(p=><div key={p.id} style={{fontSize:13,color:"#888",marginTop:6}}>⏳ {p.coins} monedas — esperando aprobación</div>)}
        </div>}
      </div>
    </div></div>
  );
}

function PrizesModal({ me, user, coins, onClose, onLogout }){
  return (
    <div className="modal-bg" onClick={onClose}><div className="sheet" onClick={e=>e.stopPropagation()}>
      <div className="sheet-handle"></div>
      <div className="pad">
        <div className="row" style={{marginBottom:14}}><div className="h2" style={{margin:0}}>👤 {user}</div><button className="close-x" onClick={onClose}>×</button></div>
        <div className="sect"><div className="row"><span>Monedas activas</span><b style={{fontSize:18}}>🎟️ {coins}</b></div></div>
        <div className="h2" style={{fontSize:16}}>🏆 Mis premios</div>
        {me.prizes.length===0 ? <div style={{fontSize:13,color:"#888"}}>Aún no has ganado ningún premio.</div>
          : <table><thead><tr><th>Premio</th><th>Precio</th><th>Fecha</th></tr></thead><tbody>
              {me.prizes.slice().reverse().map((pr,i)=><tr key={i}><td>{pr.item}</td><td>{pr.price} $</td><td style={{color:"#999"}}>{new Date(pr.at).toLocaleDateString()}</td></tr>)}
            </tbody></table>}
        <button className="primary" style={{marginTop:18,background:"#f0f0f6",color:"#666"}} onClick={onLogout}>Cerrar sesión</button>
      </div>
    </div></div>
  );
}

function AdminModal({ db, setDb, auctions, setAuctions, onClose, onLogout }){
  const [nameDraft,setNameDraft]=useState("");
  const cfg=db.config;
  const setCfg=(patch)=>setDb(prev=>({...prev, config:{...prev.config,...patch}}));
  const pending=db.purchases.filter(p=>p.status==="pending");
  const approve=async(pur)=>{ await sb.rpc("approve_purchase",{p_id:pur.id}); REFRESH(); };
  const reject=async(pur)=>{ await sb.rpc("reject_purchase",{p_id:pur.id}); REFRESH(); };
  const setCoins=(uname,val)=>setDb(prev=>({...prev, users:{...prev.users,[uname]:{...prev.users[uname],coins:Math.max(0,val)}}}));
  const toggleAuction=(id)=>setAuctions(prev=>prev.map(a=>a.id===id?{...a,disabled:!a.disabled}:a));
  const setField=(id,f,v)=>setAuctions(prev=>prev.map(a=>{ if(a.id!==id) return a; const n={...a,[f]:v}; n.floor=Math.round(n.startPrice*n.floorPct); if(f==="startPrice") n.price=v; return n; }));
  const users=Object.entries(db.users).filter(([,u])=>u.role!=="admin");
  return (
    <div className="modal-bg" onClick={onClose}><div className="sheet" onClick={e=>e.stopPropagation()}>
      <div className="sheet-handle"></div>
      <div className="pad">
        <div className="row" style={{marginBottom:16}}><div className="h2" style={{margin:0}}>⚙️ Administración</div><button className="close-x" onClick={onClose}>×</button></div>

        <div className="sect">
          <b>💳 Compras pendientes ({pending.length})</b>
          {pending.length===0?<div style={{fontSize:13,color:"#888",marginTop:6}}>No hay solicitudes.</div>
            :pending.map(p=>(<div className="row" key={p.id} style={{marginTop:10}}>
              <div style={{fontSize:13}}><b>{p.user}</b> pide 🎟️ {p.coins} ({p.price} €)</div>
              <div style={{display:"flex",gap:6}}>
                <button className="mini" style={{background:"#dcfce7",color:"#15803d"}} onClick={()=>approve(p)}>Aprobar</button>
                <button className="mini" style={{background:"#ffe4e6",color:"#be123c"}} onClick={()=>reject(p)}>Rechazar</button>
              </div></div>))}
        </div>

        <div className="sect">
          <b>👥 Usuarios y saldo</b>
          {users.length===0?<div style={{fontSize:13,color:"#888",marginTop:6}}>Sin usuarios registrados.</div>
            :users.map(([name,u])=>(<div className="row" key={name} style={{marginTop:10}}>
              <div>{name}</div>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <input type="number" value={u.coins} onChange={e=>setCoins(name,Number(e.target.value))} onBlur={e=>sb.rpc("admin_set_coins",{p_user:u.id,p_coins:Math.max(0,Number(e.target.value))}).then(()=>REFRESH())} style={{width:80,padding:7,borderRadius:8,border:"1.5px solid #dcdce6",background:"#fafafc"}} />🎟️
              </div></div>))}
        </div>

        <div className="sect">
          <div className="row"><div><b>🤖 Bots automáticos</b><div style={{fontSize:12,color:"#888"}}>{cfg.botsOn?"Activos":"En pausa"}</div></div>
            <button className="mini" onClick={()=>setCfg({botsOn:!cfg.botsOn})} style={{background:cfg.botsOn?"#dcfce7":"#e5e5ec",color:cfg.botsOn?"#15803d":"#888"}}>{cfg.botsOn?"ON":"OFF"}</button>
          </div>
          <div style={{marginTop:12}}>
            <div style={{fontSize:12,color:"#888",marginBottom:4}}>Velocidad de pujas: {Math.round(cfg.activity*100)}%</div>
            <input type="range" min="0" max="100" value={Math.round(cfg.activity*100)} onChange={e=>setCfg({activity:Number(e.target.value)/100})} style={{width:"100%"}} />
          </div>
        </div>

        <div className="sect">
          <b>Nombres de pujadores ({cfg.names.length})</b>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,margin:"10px 0"}}>
            {cfg.names.map((n,i)=><span className="chip" key={i}>{n}<button onClick={()=>setCfg({names:cfg.names.filter((_,j)=>j!==i)})}>×</button></span>)}
          </div>
          <div style={{display:"flex",gap:8}}>
            <input className="field" style={{marginBottom:0}} placeholder="Añadir nombre" value={nameDraft} onChange={e=>setNameDraft(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter"&&nameDraft.trim()){setCfg({names:[...cfg.names,nameDraft.trim()]});setNameDraft("");}}} />
            <button className="mini" style={{background:"#7c3aed",color:"#fff",padding:"0 18px"}} onClick={()=>{if(nameDraft.trim()){setCfg({names:[...cfg.names,nameDraft.trim()]});setNameDraft("");}}}>+</button>
          </div>
        </div>

        <div className="sect" style={{marginBottom:14}}>
          <b>Subastas</b>
          {auctions.map(a=>(
            <div key={a.id} style={{padding:10,borderRadius:10,background:"#fff",marginTop:8,border:"1px solid #eee"}}>
              <div className="row" style={{marginBottom:8}}>
                <div style={{fontSize:14,fontWeight:600}}>{a.item.emoji} {a.item.name}</div>
                <button className="mini" onClick={()=>toggleAuction(a.id)} style={{background:a.disabled?"#e5e5ec":"#dcfce7",color:a.disabled?"#888":"#15803d"}}>{a.disabled?"Activar":"Desactivar"}</button>
              </div>
              <div style={{display:"flex",gap:8}}>
                {[["Precio","startPrice",a.startPrice],["Suelo %","floorPct",Math.round(a.floorPct*100)],["Paso $","step",a.step]].map(([lab,f,val])=>(
                  <label key={f} style={{flex:1,fontSize:11,color:"#888",display:"flex",flexDirection:"column",gap:4}}>{lab}
                    <input type="number" value={val} onChange={e=>setField(a.id,f,f==="floorPct"?Number(e.target.value)/100:Number(e.target.value))}
                      style={{padding:8,borderRadius:8,border:"1.5px solid #dcdce6",background:"#fafafc",width:"100%",boxSizing:"border-box"}} />
                  </label>
                ))}
              </div>
            </div>
          ))}
        </div>

        <button className="primary" style={{background:"#f0f0f6",color:"#666"}} onClick={onLogout}>Cerrar sesión</button>
      </div>
    </div></div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
